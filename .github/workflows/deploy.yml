name: Deploy Lovable to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Find build output
        id: find_output
        run: |
          echo "Looking for build output..."

          if [ -d "./dist" ]; then
            echo "BUILD_DIR=./dist" >> "$GITHUB_ENV"
            echo "Found: ./dist"
          elif [ -d "./.output/public" ]; then
            echo "BUILD_DIR=./.output/public" >> "$GITHUB_ENV"
            echo "Found: ./.output/public"
          elif [ -d "./.output" ]; then
            echo "BUILD_DIR=./.output" >> "$GITHUB_ENV"
            echo "Found: ./.output"
          elif [ -d "./build" ]; then
            echo "BUILD_DIR=./build" >> "$GITHUB_ENV"
            echo "Found: ./build"
          else
            echo "ERROR: No build output folder found."
            echo "===== ROOT ====="
            ls -la
            echo "===== DIRECTORIES ====="
            find . -maxdepth 4 -type d -print
            exit 1
          fi

      - name: Show selected build folder
        run: |
          echo "Using build folder: $BUILD_DIR"
          echo "===== CONTENTS ====="
          ls -la "$BUILD_DIR"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
